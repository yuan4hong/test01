# =============================================================================
# Debezium Server: PostgreSQL -> Redis Stream
#
# CDC events land in Redis Streams, consumed by debezium_zerobus_bridge.py
# which pushes them to Databricks Delta tables via Zerobus Ingest SDK.
# =============================================================================

# --- Sink: Redis Stream (lightweight, zero-config broker) ---
debezium.sink.type=redis
debezium.sink.redis.address=localhost:6379
debezium.sink.redis.memory.threshold.percentage=85
debezium.sink.redis.batch.size=500

# --- Source: PostgreSQL CDC ---
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.plugin.name=pgoutput
debezium.source.offset.storage.file.filename=data/offsets.dat
debezium.source.offset.flush.interval.ms=0
debezium.source.database.hostname=maestro-cluster-rw.maestro.svc.cluster.local
debezium.source.database.port=5432
debezium.source.database.user=debezium
debezium.source.database.password=dcartm1234
debezium.source.database.dbname=maestro
debezium.source.topic.prefix=tutorial
debezium.source.slot.name=debezium_test2
debezium.source.slot.drop.on.stop=true

# Use existing publication (already created on primary)
debezium.source.publication.name=kratos_cdc_pub_test1
debezium.source.publication.autocreate.mode=disabled

# Capture only slurm_nodes table
debezium.source.table.include.list=public.slurm_nodes

# Skip startup snapshot; use incremental snapshot via signal table instead
debezium.source.snapshot.mode=no_data

# Engine timeout for slot creation (production DBs can block CREATE_REPLICATION_SLOT)
debezium.source.internal.task.management.timeout.ms=300000

# Heartbeat to keep replication slot active
debezium.source.heartbeat.interval.ms=10000
debezium.source.heartbeat.action.query=UPDATE cdc_heartbeat SET last_update = now() WHERE id = 1

# Incremental snapshot signals table
debezium.source.signal.data.collection=inventory.debezium_signal

# --- Output format: JSON without schema envelope ---
debezium.format.value=json
debezium.format.value.schemas.enable=false
debezium.format.key=json
debezium.format.key.schemas.enable=false

# --- Quarkus ---
quarkus.log.console.json=false
quarkus.kubernetes-config.enabled=false
quarkus.kubernetes-client.trust-certs=false
quarkus.kubernetes-client.namespace=none